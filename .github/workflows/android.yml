name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach the APK to a release on version tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the version (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($version)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build web app and copy it into the Android project
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          name="stormbrew-${version}-${GITHUB_SHA::7}-debug.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check the APK is signed with the project's key
        run: |
          # Every build must use android/app/debug.keystore, or phones refuse it as an update.
          expected=03E70453BF357252B0CD89DCEDD0E39D95403F1A718D16F250F1248BFB4784C5
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "${{ steps.apk.outputs.name }}")
          echo "$certs"
          # Every signer line ("V2 Signer: certificate SHA-256 digest: ...") must name this key.
          actual=$(echo "$certs" | awk -F'SHA-256 digest: ' 'NF > 1 { print toupper($2) }' | sort -u)
          [ "$actual" = "$expected" ] || { echo "::error::APK is signed with an unexpected key: $actual"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: stormbrew-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach APK to a GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" \
            --title "Stormbrew $GITHUB_REF_NAME" --generate-notes \
            --notes "Download the APK below and open it on an Android phone (allow installing from this source when asked). A new version installs over the old one and keeps your saved run and Grimoire. A test build from before 0.12.0 has to be uninstalled once first."
